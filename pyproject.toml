[project]
name = "localmind"
version = "0.2.0"
description = "A fully local RAG that sorts your documents and answers questions about them, built step by step for learning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.1",
    "pypdf[crypto]>=5.0",
    "pypdfium2>=4.11",
]

[project.scripts]
localmind = "localmind.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
